name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        working-directory: backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: backend
        run: cmake --build build --config Release --parallel

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: backend
        env:
          PARKING_CAPACITY: "10"
          PARKING_FEE_PER_HOUR: "3.5"
        run: |
          # 通过管道喂入 "0" 添加测试数据，再喂入 "q" 退出，验证可执行文件可正常启动
          printf '0\n\nq\n' | ./build/parking_system

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        env:
          PARKING_CAPACITY: "10"
          PARKING_FEE_PER_HOUR: "3.5"
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter parking_system.exe | Select-Object -First 1
          if (-not $exe) { throw "parking_system.exe not found" }
          "0`n`nq`n" | & $exe.FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parking_system-${{ matrix.os }}
          path: |
            backend/build/parking_system
            backend/build/**/parking_system.exe
          if-no-files-found: ignore

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: parking-system:ci
          load: true

      - name: Smoke test image
        run: |
          # 启动容器后直接喂入交互输入，验证 ENTRYPOINT 可直接运行程序
          printf '0\n\nq\n' | docker run --rm -i \
            -e PARKING_CAPACITY=10 \
            -e PARKING_FEE_PER_HOUR=3.5 \
            parking-system:ci
