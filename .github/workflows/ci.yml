name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make

      - name: Configure CMake
        working-directory: backend
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: backend
        run: cmake --build build -j$(nproc)

      - name: Verify binary exists
        run: ls -la backend/build/parking_system

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: parking-system:ci

      - name: Verify Docker image runs
        run: |
          docker run --rm -e PARKING_CAPACITY=50 -e PARKING_FEE_PER_HOUR=3.0 parking-system:ci <<< "q"
